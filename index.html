<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulau Petualangan - Komunikasi Interpersonal</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:#fbfaf4;color:#203d36}
header{background:#235d4b;color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:white;border-radius:20px;padding:25px;margin:20px 0;box-shadow:0 5px 20px #0002}
button{background:#235d4b;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}
button:hover{background:#174534}
.timer{font-size:32px;font-weight:bold;color:#b33}
.area{display:inline-block;background:#e8f1e8;padding:15px;margin:8px;border-radius:15px;cursor:pointer}
.hidden{display:none}
.answer{display:block;width:100%;margin:8px 0;text-align:left;background:#fff;color:#203d36;border:1px solid #ccc}
.answer:hover{background:#e8f1e8}
</style>
</head>

<body>
<header>
<h1>🏝️ Pulau Petualangan</h1>
<p>Komunikasi Interpersonal</p>
</header>

<div class="container">
<div class="card">
<h2>⏱ Waktu Petualangan</h2>
<div class="timer" id="timer">10:00</div>
<p id="status">Klik mulai untuk memulai ekspedisi.</p>
<button onclick="startGame()">Mulai Petualangan</button>
</div>

<div class="card">
<h2>🗺️ Enam Persinggahan</h2>
<div id="map"></div>
<p>Skor: <b id="score">0</b></p>
<p>Area selesai: <b id="done">0/6</b></p>
</div>

<div class="card hidden" id="game">
<h2 id="title"></h2>
<p id="question"></p>
<div id="answers"></div>
</div>

<div class="card hidden" id="finish"></div>
</div>

<script>
const areas=[
["Dermaga Makna","Apa kunci komunikasi interpersonal?",["Memahami orang lain","Mengabaikan lawan bicara","Berbicara sebanyak mungkin"],0],
["Hutan Pesan","Gangguan karena suara ramai disebut?",["Noise","Dampak","Pesan"],0],
["Teluk Ekspresi","Senyum dan intonasi termasuk?",["Nonverbal","Verbal tulisan","Pesan digital"],0],
["Jembatan Empati","Sikap empati adalah?",["Memahami sudut pandang orang lain","Menyalahkan","Menghindar"],0],
["Bukit Tenang","Saat menghadapi keluhan, langkah awal?",["Mendengarkan","Membalas marah","Mengabaikan"],0],
["Mercusuar Layanan","Komunikasi digital membutuhkan?",["Etika dan informasi jelas","Data pribadi disebar","Bahasa rumit"],0]
];

let score=0,done=0,time=600,interval=null,current=0;

function startGame(){
if(interval)return;
interval=setInterval(()=>{
time--;
let m=Math.floor(time/60),s=time%60;
document.getElementById("timer").innerHTML=m+":"+String(s).padStart(2,"0");
if(time<=0){clearInterval(interval);gameOver();}
},1000);
document.getElementById("status").innerHTML="Ekspedisi dimulai!";
}

function draw(){
let map=document.getElementById("map");
map.innerHTML="";
areas.forEach((a,i)=>{
let d=document.createElement("div");
d.className="area";
d.innerHTML=(i+1)+". "+a[0];
d.onclick=()=>openArea(i);
map.appendChild(d);
});
}

function openArea(i){
current=i;
document.getElementById("game").classList.remove("hidden");
document.getElementById("title").innerHTML=areas[i][0];
document.getElementById("question").innerHTML=areas[i][1];
let box=document.getElementById("answers");
box.innerHTML="";
areas[i][2].forEach((x,n)=>{
let b=document.createElement("button");
b.className="answer";
b.innerHTML=x;
b.onclick=()=>answer(n);
box.appendChild(b);
});
}

function answer(n){
if(n===areas[current][3]){
score+=100;
done++;
document.getElementById("score").innerHTML=score;
document.getElementById("done").innerHTML=done+"/6";
alert("Benar! Area selesai.");
if(done===6)finishGame();
}else alert("Belum tepat, coba lagi.");
}

function finishGame(){
clearInterval(interval);
document.getElementById("finish").classList.remove("hidden");
document.getElementById("finish").innerHTML="<h2>🏆 Ekspedisi Selesai</h2><p>Skor akhir: "+score+"</p>";
}

function gameOver(){
document.getElementById("finish").classList.remove("hidden");
document.getElementById("finish").innerHTML="<h2>⌛ Waktu Habis</h2><p>Silakan ulangi petualangan.</p>";
}

draw();
</script>
</body>
</html>
